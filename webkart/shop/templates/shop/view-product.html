{% extends 'base.html' %}

{% load static %}

{% block title %} View Product {% endblock %}

{% block body %}
<div class="container my-2">
    <div class="">
        <div class="row g-0">
            <div class="p-2 col-md-4">
                <img src="{{product.image.url}}" class="img-fluid rounded-start" alt="{{product.title}}">
                <div class="text-center mt-4">
                    <button id="pr{{product.id}}" data-image="{{product.image.url}}" data-title="{{product.title}}" data-price="{{product.price}}" class="btn btn-primary add-to-cart me-2">Add To Cart</button>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card-body p-2">
                    <h4 class="card-title mb-2">{{product.title}}</h4>
                    <p class="card-text text-muted mb-1">
                        Brand: <strong>{{product.brand|title}}</strong>
                    </p>
                    <p class="card-text fs-2 mb-3">₹<span class="product-price">{{product.price}}</span></p>
                    <p class="card-text mb-1 ">{{product.desc}}</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script type="module">
    import {convertToIndianRupees} from "{% static 'js/utils_functions.js' %}"

    // format product price
    let p = "{{ product.price }}";
    let inr_format = convertToIndianRupees(+p)
    $(".product-price").html(inr_format)
</script>
{% endblock %}
