{% extends 'base.html' %}

{% load static %}

{% block title %} View Cart {% endblock %}

{% block body %}
<div class="container my-2">
    <div id="cartItemContainer" class="row g-3 my-3"></div>
</div>
{% endblock %}

{% block script %}
<script type="module">
    import {convertToIndianRupees} from "{% static 'js/utils_functions.js' %}"

    function showCartItems() {
        let cart = JSON.parse(localStorage.getItem('cart')) || []
        let elem = ""
        let totalPrice = 0

        if (cart?.length) {
            elem += `
                <div class='mb-4 d-flex align-items-center justify-content-between'>
                    <h3 class='m-0'>Cart Items</h3>
                    <button class='btn btn-danger clear-cart-btn'>Clear Cart</button>
                </div>
                `
            cart.forEach(item => {
                totalPrice += (Number(item.price) * Number(item.quantity))
                elem += `
                    <div class="col-md-6 px-2">
                        <div class="row g-0 border rounded">
                            <div class="col-3 col-md-2 p-2">
                                <img src="${item.image}" style="width: 100px;" class="img-fluid rounded-start" alt="${item.title}">
                            </div>
                            <div class="col-9 col-md-10 p-2">
                                <h6 class="text-truncate">${item.title}</h6>
                                <p class="text-muted mb-1">₹${convertToIndianRupees(item.price)}</p>
                                <p class="text-muted mb-1">Qty: ${item.quantity}</p>
                                <span id="div${item.id}" class="divpr">
                                    <button id='minus${item.id}' data-id='${item.id}' class='btn btn-primary minus'><i class="bi bi-dash pe-none"></i></button>
                                    <span class='mx-1'>${item.quantity}</span>
                                    <button id='plus${item.id}' data-id='${item.id}' class='btn btn-primary plus'><i class="bi bi-plus pe-none"></i></button>
                                </span>
                                <button data-id='${item.id}' class='btn btn-secondary remove-from-cart'>Remove</button>
                            </div>
                        </div>
                    </div>
                    `
            });
            elem += `<div>
                        <p class='mt-2'><span class='bg-light px-2 py-1 total-price'>Your Cart Total is <strong>₹${convertToIndianRupees(totalPrice)}</strong></span></p>
                        <a class="btn btn-primary" href="{% url 'shop:viewcheckout' %}">Checkout</a>
                    </div>`
        } else {
            elem = `
                    <p class='card-text text-muted fs-2 text-center'>Your Cart is Empty</p>
                    <div class="text-center">
                        <a class="btn btn-primary" href="{% url 'shop:home' %}">Shop Now</a>
                    </div>
                    `
        }
        $("#cartItemContainer").html(elem)
        
        $(".clear-cart-btn").click(function() {
            localStorage.removeItem('cart')
            $("#cartCount").html(0)
            showCartItems()
        })
    
        $(".remove-from-cart").click(function() {
            let id = this.dataset.id
            cart = cart.filter(item => item.id != id)
            updateCartCount(cart)   // function from "base.html"
            localStorage.setItem('cart', JSON.stringify(cart))
            showCartItems()
        })
    }

    showCartItems()
</script>
{% endblock %}
