{% extends 'base.html' %}

{% load static %}

{% block title %} View Cart {% endblock %}

{% block body %}
<div class="container">
    <div class="my-4">
        <div id="checkoutItemsContainer" class="row g-3 my-3"></div>
    </div>
    <div class="my-4 place-order-form-container">
        <h3 class='mb-2 text-capitalize'>step 2 - enter address & other details</h3>
        <form class="row g-3" id="checkoutForm" action="{% url 'shop:viewcheckout' %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="itemsJson" id="itemsJson">
            <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input type="text" name="name" class="form-control" id="name" required>
            </div>
            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="email" class="form-control" id="email" required>
            </div>
            <div class="col-12">
                <label for="address" class="form-label">Address</label>
                <input type="text" name="address" class="form-control" id="address" required>
            </div>
            <div class="col-12">
                <label for="address2" class="form-label">Address 2</label>
                <input type="text" name="address2" class="form-control" id="address2" required>
            </div>
            <div class="col-md-6">
                <label for="phone" class="form-label">phone</label>
                <input type="tel" name="phone" class="form-control" id="phone" required>
            </div>
            <div class="col-md-6">
                <label for="city" class="form-label">City</label>
                <input type="text" name="city" class="form-control" id="city" required>
            </div>
            <div class="col-md-6">
                <label for="state" class="form-label">state</label>
                <input type="text" name="state" class="form-control" id="state" required>
            </div>
            <div class="col-md-6">
                <label for="zip" class="form-label">Zip</label>
                <input type="text" name="zip" class="form-control" id="zip" required>
            </div>
            <div class="col-12">
                <button type="button" id="checkoutFormSubmit" class="btn btn-primary">Place Order</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block script %}
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script type="module">
    import {convertToIndianRupees} from "{% static 'js/utils_functions.js' %}"

    let totalPrice = 0

    function showCheckoutItems() {
        let cart = JSON.parse(localStorage.getItem('cart')) || []
        let elem = ""

        if (cart?.length) {
            elem += `<h3 class='mb-3 text-capitalize'>step 1 - checkout - review your cart items</h3>`
            cart.forEach(item => {
                totalPrice += (Number(item.price) * Number(item.quantity))
                elem += `
                    <div class="col-md-6 px-2">
                        <div class="row g-0 border rounded">
                            <div class="col-3 col-md-2 p-2">
                                <img src="${item.image}" style="width: 100px;" class="img-fluid rounded-start" alt="${item.title}">
                            </div>
                            <div class="col-9 col-md-10 p-2">
                                <h6 class="text-truncate">${item.title}</h6>
                                <p class="text-muted mb-1">₹${convertToIndianRupees(item.price)}</p>
                                <p class="text-muted mb-1">Qty: ${item.quantity}</p>
                            </div>
                        </div>
                    </div>
                    `
            });
            elem += `<p class='m-0 mt-3'><span class='bg-light px-2 py-1 d-block'>Your Cart Total is <strong>₹${convertToIndianRupees(totalPrice)}</strong> | Enter your details below & place your order.</span></p>`
            $(".place-order-form-container").removeClass("d-none")
        } else {
            elem = `
                    <p class='card-text text-muted fs-2 text-center'>Your Cart is Empty</p>
                    <div class="text-center">
                        <a class="btn btn-primary" href="{% url 'shop:home' %}">Shop Now</a>
                    </div>
                    `
            $(".place-order-form-container").addClass("d-none")
        }
        $("#checkoutItemsContainer").html(elem)
        
        // collect all cart items
        if (cart?.length) {
            $("#itemsJson").val(JSON.stringify(cart))
            if (JSON.parse('{{thank}}')) {
                localStorage.setItem('toast', 'Thanks for ordering with us. Your order ID is <stong>{{id}}</strong>. Use it to track your order using our order tracker')
                localStorage.removeItem("cart")
                document.location = "{% url 'shop:tracker' %}"
            }
        }
    }

    showCheckoutItems()

    document.getElementById('checkoutFormSubmit').addEventListener('click', async function(e) {
        const checkoutForm = document.getElementById('checkoutForm')
        let req_data =  {
            amount: (totalPrice * 100),
            currency: "INR"
        }
    
        try {
            // 1st step : create an order
            let res = await fetch("{% url 'shop:order' %}", {
                method: "POST",
                body: JSON.stringify(req_data),
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": checkoutForm.csrfmiddlewaretoken.value
                }
            })
            let data = await res.json()

            // 2nd step : configure razorpay options
            let options = {
                key: data?.razorpay_merchant_key,
                amount: data?.amount,
                currency: data?.currency,
                name: "WebKart",
                description: `Test Payment for order ${data?.order_id}`,
                order_id: data?.order_id,
                handler: async function(response) {
                    let res = await fetch("{% url 'shop:verify' %}", {
                        method: "POST",
                        body: JSON.stringify(response),
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": checkoutForm.csrfmiddlewaretoken.value
                        }
                    })
                    let data = await res.json()
                    
                    if (res.status == 200) {
                        checkoutForm.submit()
                    }
                },
                prefill: {
                    name: checkoutForm.name.value,
                    email: checkoutForm.email.value,
                    contact: checkoutForm.phone.value
                }
            };
            // 3rd step : open razorpay checkout
            const rzp = new Razorpay(options)
            rzp.open()
        } catch (error) {
            console.log("error: ", error.message);
        }
        
    })
</script>
{% endblock %}
