{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'images/dj-favicon.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <style>
        .fs10 {font-size: 10px;}
        .fs11 {font-size: 11px;}
        .fs12 {font-size: 12px;}
        .fs14 {font-size: 14px;}
        
        .auth-form-container {
          width: 100%;
          max-width: 400px;
        }

        .auth-form :is(input[type=text], input[type=email], input[type=password], textarea) {
            width: 100%;
            padding: 8px 12px;
            margin: 2px 0;
            border: 2px solid #999;
            border-radius: 4px;
            outline: none;
            transition: 0.3s;
        }
        
        .auth-form :is(input[type=text], input[type=email], input[type=password], textarea):focus {
            box-shadow: 0 0 8px #999;
        }

        .auth-form .errorlist {
            list-style: none;
            color: #ff0000;
            padding: 0;
            margin: 0;
            font-size: 13px;
        }
    </style>
    {% block style %}{% endblock %}
  </head>
  <body>
    {% block body %}{% endblock %}
     <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js" integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V" crossorigin="anonymous"></script>
    {% block script %}{% endblock %}
  </body>
</html>
